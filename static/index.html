<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime Monitor</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <h1>Uptime Monitor <span id="updated"></span></h1>
  <div class="card" id="login-card">
    <h2><span>Log in to add or delete sites</span></h2>
    <form id="login-form">
      <input type="password" id="password-input" autocomplete="current-password" placeholder="Admin password" required>
      <button type="submit">Log in</button>
    </form>
    <p id="login-message"></p>
  </div>
  <div class="card" id="add-card">
    <h2><span>Add a site</span></h2>
    <form id="add-form">
      <input type="url" id="url-input" placeholder="https://example.com" required>
      <button type="submit">Add</button>
    </form>
    <button id="logout-button">Log out</button>
    <p id="form-message"></p>
  </div>
  <div id="sites"></div>

  <script src="/static/app.js"></script>
</body>

</html>
